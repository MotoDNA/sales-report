<style>
:root{
  --red:#C8102E; --red2:#9E0B22; --redsoft:#FCE9EC; --ink:#1E1A17; --ink2:#4A443F; --mute:#8A837C;

body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
aside.nav{width:232px;background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid #3a342f;margin-bottom:16px}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px}
.logo b{font-size:17px;display:block}.logo small{color:#b9b0a6;font-size:11px;letter-spacing:.08em}
.navgroup{font-size:11px;color:#8d857d;padding:14px 10px 6px;letter-spacing:.06em}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#ddd5cc;text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:#2c2622}
.nav a.on{background:var(--red);color:#fff}
.nav .foot{margin-top:auto;font-size:11px;color:#8d857d;padding:10px}
main{flex:1;padding:26px 32px 60px;min-width:0}

.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800}
.top p{color:var(--mute);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--mute);font-size:12px}
.kpi .lab{color:var(--mute);font-size:12px;font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 4px}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}

.b-red{background:var(--redsoft);color:var(--red)}.b-gold{background:#FFF3DC;color:#A86B00}.b-green{background:#E5F4EC;color:var(--green)}.b-gray{background:#F1ECE6;color:var(--ink2)}.b-blue{background:#E6EEFB;color:var(--blue)}

.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,100%);background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.15);transform:translateX(100%);transition:.25s;z-index:20;overflow:auto;padding:24px}

.seg button.on.ok{background:var(--green);color:#fff}.seg button.on.ng{background:var(--red);color:#fff}.seg button.on.na{background:#999;color:#fff}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kcol{background:#F6F0E8;border-radius:14px;padding:12px;min-height:160px}
.kcol h4{font-size:13px;margin-bottom:10px}
.mcard{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);font-size:13px}
.mcard .meta{color:var(--mute);font-size:11px;margin-top:4px}
.aibox{display:flex;gap:10px}
.aibox input{flex:1;padding:14px 16px;font-size:15px;border-radius:14px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;margin:8px 6px 0 0;font-size:12px;color:var(--ink2)}
.chat{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:90%;padding:12px 14px;border-radius:14px;line-height:1.6}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff}
.bub.ai{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.notice{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.notice .t{font-weight:800}
.vote{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:#F1ECE6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.hint{font-size:12px;color:var(--mute)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:50}
.toast.on{opacity:1}
.guide td{white-space:normal;vertical-align:top;line-height:1.55}
.photo-prev{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.lc-wrap{position:relative}
.lc-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.6;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lc-tip.on{opacity:1}
.lc-tip b{font-size:14px}
.lc-tip .lc-d{color:#FFD58A;font-weight:700}
.lc-tip .lc-s{color:#cfc6bc}
.lc-tip .up{color:#7BE3A6}.lc-tip .down{color:#FF9AA8}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tg button{border:none;background:#fff;padding:6px 14px;font-weight:700;font-size:12px;color:var(--ink2)}
.tg button.on{background:var(--ink);color:#fff}
</style>

<body>
<div class="app">
<aside class="nav">
  <div class="logo"><div class="mark">구</div><div><b>구도로 HUB</b><small>GUDORO OPERATIONS</small></div></div>

<script>
/* ============ 샘플 데이터 생성 ============ */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261117);
const pick=a=>a[Math.floor(R()*a.length)];
const won=n=>Math.round(n).toLocaleString('ko-KR');
const man=n=>{const v=n/10000;return(v>=1000?Math.round(v).toLocaleString('ko-KR'):v.toFixed(1).replace(/\.0$/,''))+'만'};
const pct=n=>(n>0?'+':'')+(n*100).toFixed(1)+'%';
const today=new Date();today.setHours(0,0,0,0);
const yday=new Date(today);yday.setDate(today.getDate()-1);
let BASE=yday, REAL=null;
const fmtD=d=>`${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})`;

const REGIONS={
 '인천':['루원시티','부평역','계산','송도센트럴','구월','주안','청라','가정','검단','연수','논현','부개','작전','간석','만수','학익','영종','송림','동춘','서창','십정','삼산'],
 '서울':['노원','신림','건대','홍대','강서','구로디지털','신촌','미아','천호','잠실새내','목동','왕십리','수유','성수','사당','신정'],
 '경기':['부천역','일산','수원역','인계','안양','평촌','의정부','김포','시흥','광명','하남','동탄','분당','산본','안산','중동','상동','파주','구리','오산','평택','광교','배곧','고양'],
 '충청':['천안','청주','대전둔산','세종','아산'],
 '경상':['부산서면','해운대','대구동성로','창원','울산'],
 '전라':['광주상무','전주'],
 '강원':['원주','춘천']
};
const DIRECT=['루원시티','부평역','부천역','송도센트럴','노원','계산'];
const MENUS=[
 {n:'오리지널통닭',c:'통닭',p:19900,w:26},{n:'반마리 오리지널',c:'통닭',p:11900,w:8},
 {n:'밥을 품은 마늘쫑닭',c:'통닭',p:22900,w:10},{n:'치즈폭탄통닭',c:'통닭',p:24900,w:9},
 {n:'양념통닭',c:'통닭',p:21900,w:8},{n:'로제크림통닭',c:'통닭',p:24900,w:5},
 {n:'머쉬룸크림통닭',c:'통닭',p:24900,w:3},{n:'콘크런치통닭',c:'통닭',p:22900,w:4},
 {n:'오븐베이크치킨',c:'치킨',p:19900,w:4},{n:'고르곤졸라 페스츄리피자',c:'사이드',p:15900,w:3},
 {n:'철판떡볶이',c:'안주',p:13900,w:5},{n:'빨간어묵탕',c:'안주',p:14900,w:4},
 {n:'다낭버터쉬림프',c:'안주',p:16900,w:3},{n:'롤소시지플레이트',c:'안주',p:15900,w:3},
 {n:'쫄뱅이',c:'안주',p:16900,w:3},{n:'오징어꿔바로우',c:'사이드',p:14900,w:2},
 {n:'찰떡고구마볼',c:'사이드',p:6900,w:2},{n:'인절미팥빙수',c:'디저트',p:9900,w:1},
];
let stores=[];let sid=1;
for(const [rg,list] of Object.entries(REGIONS)){for(const nm of list){
  const base=(R()*1.3+0.7)*1180000*(rg==='인천'?1.08:rg==='서울'?1.05:1);
  const trend=R()<0.18?-(0.15+R()*0.25):(R()-0.4)*0.12; // 일부 매장 하락
  const hall=0.42+R()*0.26, take=0.08+R()*0.1, deliv=1-hall-take;
  const alcohol=0.1+R()*0.18;
  const days=[];
  for(let i=27;i>=0;i--){const d=new Date(yday);d.setDate(yday.getDate()-i);
    const wd=d.getDay();const season=[0.95,0.72,0.78,0.85,0.98,1.32,1.4][wd];
    const t=1+trend*((27-i)/27);let v=base*season*t*(0.88+R()*0.24);
    if(i===0&&trend<-0.15)v*=0.85;
    days.push({d,v});}
  const qsc=Math.round(68+R()*30);
  const lastInsp=Math.floor(R()*75);
  const aov=31000+R()*9000;
  const unreg=R()<0.14?pick(['치즈추가(매장자체)','누룽지 곱빼기','콜라 1.25L 서비스','반반 소스 변경']):null;
  stores.push({id:sid++,name:nm+'점',region:rg,direct:DIRECT.includes(nm),base,trend,hall,take,deliv,alcohol,days,qsc,lastInsp,aov,unreg,
    owner:pick(['김','이','박','최','정','강','조','윤','장','임'])+pick(['민수','지영','현우','서연','도윤','하은','준호','수빈','성훈','유진'])});
}}
function derive(s){
  const D=s.days,L=D.length,at=i=>i>=0&&i<L?D[i].v:null,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  s.y=at(L-1); s.lw=at(L-8);
  const sw=[at(L-8),at(L-15),at(L-22)].filter(v=>v!=null); s.sameWd=sw.length?avg(sw):s.y;
  s.vsWd=s.sameWd?s.y/s.sameWd-1:0;
  s.avg7=avg(D.slice(Math.max(0,L-7)).map(d=>d.v));
  const p7=D.slice(Math.max(0,L-14),Math.max(0,L-7)).map(d=>d.v); s.prev7=p7.length?avg(p7):s.avg7;
  s.wow=s.prev7?s.avg7/s.prev7-1:0;
  s.risk=[];
  if(s.vsWd<=-0.2)s.risk.push('매출급감');
  if(s.wow<=-0.1)s.risk.push('주간하락');
  if(qLow(s))s.risk.push('QSC미흡');
  if(late(s))s.risk.push('점검지연');
}
const qLow=s=>s.qsc!=null&&s.qsc<78, late=s=>s.lastInsp!=null&&s.lastInsp>45;
stores.forEach(s=>{
  s.orders=Math.round(s.days[s.days.length-1].v/s.aov);
  s.menu=MENUS.map(m=>{const w=m.w*(0.6+R()*0.8);return{...m,w}});
  derive(s);
  const tw=s.menu.reduce((a,b)=>a+b.w,0);
  s.menu.forEach(m=>{m.amt=s.avg7*7*(1-s.alcohol)*m.w/tw;m.qty=Math.round(m.amt/m.p)});
});
const SAMPLE=stores;
const regions=()=>[...new Set(stores.map(s=>s.region))];
const pctOr=v=>v==null?'-':(v*100).toFixed(0)+'%';
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);

/* ============ 저장소 ============ */
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('gudoro_'+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem('gudoro_'+k,JSON.stringify(v))};
let missions=LS.get('missions',[
 {id:1,store:'구월점',title:'누룽지 철판 재벌 시간 미준수(2분→4분 기준)',status:'todo',due:'D-3',by:'SV 박성훈'},
 {id:2,store:'신림점',title:'배달 포장 용기 뚜껑 실링 불량',status:'doing',due:'D-1',by:'SV 이유진'},
 {id:3,store:'안산점',title:'홀 테이블 철판 받침 교체',status:'done',due:'완료',by:'SV 박성훈'},
]);
let notices=LS.get('notices',[
 {id:1,title:'[신메뉴] 오븐베이크치킨·페스츄리피자 운영 매장 신청',body:'매장별로 오븐베이크치킨 또는 야채후라이드치킨 중 1종 + 페스츄리피자 2종을 운영합니다. 운영 희망 메뉴를 투표해주세요.',vote:{opts:['오븐베이크치킨','야채후라이드치킨'],cnt:[31,18],my:null},date:'11/14',comments:['부평역점: 오븐 용량 확인 부탁드려요']},

/* ============ 차트 (SVG) ============ */
function barsH(items,{max,color='#C8102E',fmt=man}={}){max=max||Math.max(...items.map(i=>i.v));
  return items.map(i=>`<div style="display:flex;align-items:center;gap:10px;margin:7px 0">
   <div style="width:110px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.l}</div>
   <div style="flex:1" class="bar"><i style="width:${Math.max(2,i.v/max*100)}%;background:${i.c||color}"></i></div>
   <div style="width:70px;text-align:right;font-size:12px" class="num">${fmt(i.v)}</div></div>`).join('')}
window._lc={};let LCID=0;
function line(series,labels,{h=200,colors=['#C8102E','#B9B0A6'],tips,names=['일매출','전주 동기']}={}){
  const W=640,H=h,p=30;const all=series.flatMap(s=>s.data);const mx=Math.max(...all)*1.1,mn=0;
  const x=i=>p+i*(W-2*p)/(labels.length-1),y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
  const id='lc'+(LCID++);window._lc[id]={series:series.map(s=>s.data),tips:tips||labels,names,W,H,xs:labels.map((_,i)=>x(i)),ys:series[0].data.map(y)};
  let g='';for(let k=0;k<=4;k++){const yy=p+k*(H-2*p)/4;g+=`<line x1="${p}" x2="${W-p}" y1="${yy}" y2="${yy}" stroke="#f0e9df"/>`}
  const guide=`<line class="lc-guide" x1="0" x2="0" y1="${p}" y2="${H-p}" stroke="#C8102E" stroke-opacity=".35" stroke-dasharray="3 3" style="visibility:hidden"/>`;
  const paths=series.map((s,si)=>`<path d="${s.data.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join('')}" fill="none" stroke="${colors[si]}" stroke-width="${si?2:3}" ${si?'stroke-dasharray="5 4"':''}/>`+
    (si?'':s.data.map((v,i)=>`<circle class="lc-dot" data-i="${i}" cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${colors[0]}" stroke-width="2"/>`).join(''))).join('');
  const lb=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#8A837C">${l}</text>`).join('');
  const step=(W-2*p)/Math.max(1,labels.length-1);
  const hits=labels.map((_,i)=>`<rect x="${x(i)-step/2}" y="0" width="${step}" height="${H}" fill="transparent" style="cursor:pointer" onmouseenter="lcTip('${id}',${i})" onclick="lcTip('${id}',${i})"/>`).join('');
  return `<div class="lc-wrap" id="${id}" onmouseleave="lcHide('${id}')"><svg viewBox="0 0 ${W} ${H}" width="100%">${g}${guide}${paths}${lb}${hits}</svg><div class="lc-tip"></div></div>`}
window.lcTip=(id,i)=>{const d=window._lc[id],w=document.getElementById(id);if(!d||!w)return;
  const v=d.series[0][i],v2=d.series[1]?d.series[1][i]:null,tip=w.querySelector('.lc-tip');
  tip.innerHTML=`<div class="lc-d">${d.tips[i]||''}</div><div>${d.names[0]} <b>${won(v)}원</b></div>`+(v2!=null?`<div class="lc-s">${d.names[1]} ${won(v2)}원 <span class="${v>=v2?'up':'down'}">${pct(v/v2-1)}</span></div>`:'');
  const lx=d.xs[i]/d.W*100,ty=d.ys[i]/d.H*100;tip.style.left=lx+'%';tip.style.top=ty+'%';
  tip.style.transform=`translate(${lx<15?'-10%':lx>85?'-90%':'-50%'},calc(-100% - 12px))`;tip.classList.add('on');
  const gl=w.querySelector('.lc-guide');gl.setAttribute('x1',d.xs[i]);gl.setAttribute('x2',d.xs[i]);gl.style.visibility='visible';
  w.querySelectorAll('.lc-dot').forEach(c=>{const on=+c.dataset.i===i;c.setAttribute('r',on?6:3.5);c.setAttribute('fill',on?'#C8102E':'#fff')})}
window.lcHide=id=>{const w=document.getElementById(id);if(!w)return;w.querySelector('.lc-tip').classList.remove('on');w.querySelector('.lc-guide').style.visibility='hidden';
  w.querySelectorAll('.lc-dot').forEach(c=>{c.setAttribute('r',3.5);c.setAttribute('fill','#fff')})}
function donut(parts){let a=0;const r=60,c=2*Math.PI*r;
  const segs=parts.map(p=>{const s=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${p.v*c} ${c}" stroke-dashoffset="${-a*c}" transform="rotate(-90 80 80)"/>`;a+=p.v;return s}).join('');
  return `<div style="display:flex;align-items:center;gap:20px"><svg width="160" height="160">${segs}</svg><div>${parts.map(p=>`<div style="margin:6px 0"><span class="badge" style="background:${p.c};color:#fff">${p.l}</span> <b>${(p.v*100).toFixed(1)}%</b></div>`).join('')}</div></div>`}

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function modeChip(){return REAL?`<span class="pill" style="background:#E5F4EC;border-color:#BFE3CE;color:#1d6b40"><b>● 실제 데이터</b> ${REAL.src} · ${fmtD(REAL.start)}~${fmtD(REAL.end)}</span><button class="btn ghost sm" onclick="useSample()">샘플 보기</button><button class="btn ghost sm" onclick="pickReal()">다른 파일 올리기</button>`
  :`<span class="pill" style="background:#FFF3DC;border-color:#F3D9A6;color:#8a5a00"><b>● 데모 · 샘플 데이터</b></span>${REAL_DEFAULT?`<button class="btn ghost sm" onclick="useDefault()">10월 실제 데이터 보기</button>`:''}<button class="btn sm" onclick="pickReal()" title="배달매출 + 홀매출(POS) 파일을 함께 선택하세요">실제 데이터 불러오기</button>`}
function head(t,p,right=''){return `<div class="top"><div><h1>${t}</h1><p>${p}</p></div><div class="row">${right}${modeChip()}<span class="pill">기준일 ${fmtD(BASE)} · 전체 ${stores.length}개 매장</span></div></div>`}
function riskBadges(s){return s.risk.map(r=>`<span class="badge ${r==='매출급감'?'b-red':r==='QSC미흡'?'b-gold':r==='점검지연'?'b-blue':'b-gray'}">${r}</span>`).join(' ')||'<span class="badge b-green">정상</span>'}

/* ============ 1. 일일 리포트 ============ */
function viewHome(){
  const tot=sum(stores,s=>s.y), totSW=sum(stores,s=>s.sameWd), ord=sum(stores,s=>s.orders);
  const tot7=sum(stores,s=>s.avg7),prev7=sum(stores,s=>s.prev7);
  const abn=stores.filter(s=>s.vsWd<=-0.2).sort((a,b)=>a.vsWd-b.vsWd);
  const insp=stores.filter(s=>s.risk.length>=2||(qLow(s)&&s.lastInsp>30)||(REAL&&s.risk.length)).sort((a,b)=>b.risk.length-a.risk.length||(a.qsc??100)-(b.qsc??100)||a.vsWd-b.vsWd).slice(0,6);
  const reg=regions().map(r=>{const ss=stores.filter(s=>s.region===r);return{r,v:sum(ss,s=>s.avg7)/sum(ss,s=>s.prev7)-1}}).sort((a,b)=>a.v-b.v);
  const best=[...stores].sort((a,b)=>b.y-a.y)[0];
  const deliv=sum(stores,s=>s.y*(s.deliv||0))/tot;
  const summary=`${REAL?'기준일':'어제'}(${fmtD(BASE)}) 전 가맹점 매출은 <b>${man(tot)}원</b>으로 4주 동요일 평균 대비 <b>${pct(tot/totSW-1)}</b>입니다. 주문 ${won(ord)}건, 평균 객단가 ${won(tot/ord)}원.<br>
  전일 매출 1위는 <b>${best.name}</b>(${man(best.y)}원), 배달 비중은 ${(deliv*100).toFixed(1)}%입니다.<br>
  동요일 대비 20% 이상 빠진 <b>이상 매장 ${abn.length}곳</b>이 있으며, 주간 매출이 가장 약한 지역은 <b>${reg[0].r}</b>(${pct(reg[0].v)})입니다. 오늘 우선 점검 매장은 <b>${insp.slice(0,3).map(s=>s.name).join(', ')}</b> 입니다.`;
  window._reportText=summary.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'');
  return head('일일 리포트','매일 아침, 꼭 봐야 할 내용만 정리해 드려요',`<button class="btn ghost" onclick="copyReport()">카톡 공유용 복사</button>`)+`
  <div class="report"><h2>☀ 구도로 AI 모닝 브리핑</h2><div class="sum">${summary}</div></div>
  <div class="grid g4" style="margin-top:16px">
   <div class="card kpi"><div class="lab">전일 총매출</div><div class="val">${man(tot)}원</div><span class="${tot>=totSW?'up':'down'}">${pct(tot/totSW-1)}</span> <span class="hint">4주 동요일 평균 대비</span></div>
   <div class="card kpi"><div class="lab">최근 7일 일평균</div><div class="val">${man(tot7)}원</div><span class="${tot7>=prev7?'up':'down'}">${pct(tot7/prev7-1)}</span> <span class="hint">전주 대비</span></div>
   <div class="card kpi"><div class="lab">점포당 평균 매출(전일)</div><div class="val">${man(tot/stores.length)}원</div><span class="hint">주문 ${won(ord)}건 · 객단가 ${won(tot/ord)}원</span></div>
   <div class="card kpi"><div class="lab">조치 필요 매장</div><div class="val" style="color:var(--red)">${stores.filter(s=>s.risk.length).length}곳</div><span class="hint">급감 ${abn.length} · 주간하락 ${stores.filter(s=>s.wow<=-0.1).length}${REAL?'':` · QSC미흡 ${stores.filter(qLow).length} · 점검지연 ${stores.filter(late).length}`}</span></div>
  </div>
  <div class="grid g3" style="margin-top:16px">
   <div class="card"><h3>🚨 이상 매장 <small>동요일 대비 -20%↓</small></h3><ul class="alertlist">${abn.slice(0,7).map(s=>`<li><span class="badge b-red">${s.y===0?'매출 0 (휴무·미집계?)':pct(s.vsWd)}</span><a href="#" onclick="openStore(${s.id});return false" style="font-weight:700;color:inherit">${s.name}</a><span class="sp"></span><span class="hint">${s.region} · ${man(s.y)}원</span></li>`).join('')||'<li>없음</li>'}</ul></div>
   <div class="card"><h3>📋 오늘 점검할 매장 <small>리스크 복합 순</small></h3><ul class="alertlist">${insp.map(s=>`<li><a href="#" onclick="openStore(${s.id});return false" style="font-weight:700;color:inherit">${s.name}</a><span class="sp"></span>${riskBadges(s)}</li>`).join('')}</ul></div>
   <div class="card"><h3>📍 지역별 주간 증감</h3>${reg.map(x=>`<div class="row" style="margin:8px 0"><b style="width:50px">${x.r}</b><div class="sp bar"><i style="width:${Math.min(100,Math.abs(x.v)*400)}%;background:${x.v<0?'var(--red)':'var(--green)'}"></i></div><span class="${x.v<0?'down':'up'}" style="width:60px;text-align:right">${pct(x.v)}</span></div>`).join('')}</div>
  </div>
  ${trendCard()}`}
window.copyReport=()=>{navigator.clipboard?.writeText('[구도로통닭 일일 리포트]\n'+window._reportText);toast('리포트 텍스트를 복사했어요')}

/* ============ 2. 대시보드 ============ */
function viewDash(){
  const tot=sum(stores,s=>s.avg7*7);
  const ch=[{l:'홀',v:sum(stores,s=>s.avg7*(s.hall||0))/sum(stores,s=>s.avg7),c:'#C8102E'},{l:'포장',v:sum(stores,s=>s.avg7*(s.take||0))/sum(stores,s=>s.avg7),c:'#E2A33B'},{l:'배달',v:sum(stores,s=>s.avg7*(s.deliv||0))/sum(stores,s=>s.avg7),c:'#4A443F'}];
  const reg=regions().map(r=>{const ss=stores.filter(s=>s.region===r);return{l:`${r} (${ss.length})`,v:sum(ss,s=>s.avg7)/ss.length}}).sort((a,b)=>b.v-a.v);
  const top=[...stores].sort((a,b)=>b.avg7-a.avg7).slice(0,8).map(s=>({l:s.name,v:s.avg7}));
  const bot=[...stores].sort((a,b)=>a.avg7-b.avg7).slice(0,8).map(s=>({l:s.name,v:s.avg7,c:'#8A837C'}));
  const alc=REAL?null:sum(stores,s=>s.avg7*s.alcohol)/sum(stores,s=>s.avg7);
  const directAvg=sum(stores.filter(s=>s.direct),s=>s.avg7)/stores.filter(s=>s.direct).length, frAvg=sum(stores.filter(s=>!s.direct),s=>s.avg7)/stores.filter(s=>!s.direct).length;
  return head('대시보드','보고 싶은 지표를 한 화면에서')+`
  <div class="grid g4">
   <div class="card kpi"><div class="lab">최근 7일 총매출</div><div class="val">${man(tot)}원</div></div>
   ${REAL?`<div class="card kpi"><div class="lab">기간 총매출</div><div class="val">${man(sum(stores,s=>sum(s.days,d=>d.v)))}원</div><span class="hint">${fmtD(REAL.start)}~${fmtD(REAL.end)} · 홀(POS)+배달앱</span></div>
   <div class="card kpi"><div class="lab">점포당 일평균 (최근 7일)</div><div class="val">${man(sum(stores,s=>s.avg7)/stores.length)}원</div><span class="hint">운영 매장 ${stores.length}곳</span></div>
   <div class="card kpi"><div class="lab">연환산 점포당 매출</div><div class="val">${(sum(stores,s=>s.avg7)/stores.length*365/1e8).toFixed(2)}억</div><span class="hint">최근 7일 기준 추정</span></div>`
   :`<div class="card kpi"><div class="lab">주류 매출 비중</div><div class="val">${(alc*100).toFixed(1)}%</div><span class="hint">통닭 주점 포지션 핵심 지표</span></div>
   <div class="card kpi"><div class="lab">직영 vs 가맹 일평균</div><div class="val">${man(directAvg)} / ${man(frAvg)}</div><span class="hint">직영 ${stores.filter(s=>s.direct).length}곳 기준</span></div>
   <div class="card kpi"><div class="lab">연환산 점포당 매출</div><div class="val">${(frAvg*365/1e8).toFixed(2)}억</div><span class="hint">가맹점 평균</span></div>`}
  </div>
  <div class="grid g2" style="margin-top:16px">
   <div class="card"><h3>3WAY 채널 비중 <small>홀·포장·배달</small></h3>${donut(ch)}</div>
   <div class="card"><h3>지역별 점포당 일평균 매출</h3>${barsH(reg)}</div>
   <div class="card"><h3>매출 상위 매장 <small>7일 일평균</small></h3>${barsH(top)}</div>
   <div class="card"><h3>매출 하위 매장 <small>집중 관리 대상</small></h3>${barsH(bot,{max:top[0].v})}</div>
  </div>`}

let stSort={k:'avg7',d:-1},stRegion='전체',stQ='',stRisk=false;
function viewStores(){
  let list=stores.filter(s=>(stRegion==='전체'||s.region===stRegion)&&(!stQ||s.name.includes(stQ))&&(!stRisk||s.risk.length));
  list.sort((a,b)=>(a[stSort.k]>b[stSort.k]?1:-1)*stSort.d);
  const th=(k,l)=>`<th class="s num" onclick="sortSt('${k}')">${l}${stSort.k===k?(stSort.d<0?' ▼':' ▲'):''}</th>`;
  return head('매장 비교 분석','매장별 주요 지표 비교·분석. 행을 누르면 매장 상세가 열려요')+`
  <div class="card"><div class="row" style="margin-bottom:12px">
   <select onchange="stRegion=this.value;render()">${['전체',...regions()].map(r=>`<option ${r===stRegion?'selected':''}>${r}</option>`).join('')}</select>
   <input type="text" placeholder="매장명 검색" value="${stQ}" oninput="stQ=this.value;clearTimeout(window._t);window._t=setTimeout(render,300)">
   <label class="row" style="gap:6px"><input type="checkbox" ${stRisk?'checked':''} onchange="stRisk=this.checked;render()"> 조치 필요 매장만</label>
   <span class="sp"></span><span class="hint">${list.length}개 매장</span></div>
  <div style="overflow:auto"><table><thead><tr><th>매장</th><th>지역</th>${th('y','전일매출')}${th('vsWd','동요일比')}${th('avg7','7일 일평균')}${th('wow','전주比')}${th('aov','객단가')}${th('deliv','배달비중')}${th('alcohol','주류비중')}${th('qsc','QSC')}<th>상태</th></tr></thead><tbody>
  ${list.map(s=>`<tr class="click" onclick="openStore(${s.id})"><td><b>${s.name}</b> ${s.direct?'<span class="badge b-gray">직영</span>':''}${estBadge(s)}</td><td>${s.region}</td><td class="num">${won(s.y)}</td><td class="num ${s.vsWd<0?'down':'up'}">${pct(s.vsWd)}</td><td class="num">${won(s.avg7)}</td><td class="num ${s.wow<0?'down':'up'}">${pct(s.wow)}</td><td class="num">${won(s.aov)}</td><td class="num">${pctOr(s.deliv)}</td><td class="num">${pctOr(s.alcohol)}</td><td class="num"><b style="color:${qLow(s)?'var(--red)':'inherit'}">${s.qsc??'-'}</b></td><td>${riskBadges(s)}</td></tr>`).join('')}
  </tbody></table></div></div>`}
window.sortSt=k=>{stSort=stSort.k===k?{k,d:-stSort.d}:{k,d:-1};render()}
window.openStore=id=>{const s=stores.find(x=>x.id===id);
  const topM=s.menu?[...s.menu].sort((a,b)=>b.amt-a.amt).slice(0,6):[];
  const peer=stores.filter(x=>x.region===s.region);const peerAvg=sum(peer,x=>x.avg7)/peer.length;
  $('#drawer').innerHTML=`<div class="row"><h2 style="font-size:20px">${s.name}</h2>${s.direct?'<span class="badge b-gray">직영</span>':''}<span class="sp"></span><button class="btn ghost sm" onclick="closeDrawer()">닫기 ✕</button></div>

let chatLog=[];
function viewAI(){
  return head('AI 검색','찾지 말고 물어보세요. (데모: 규칙 기반 질의 해석)')+`
  <div class="card"><div class="aibox"><input id="aiq" type="text" placeholder="예) 인천 지역 어제 매출 top 5 알려줘" onkeydown="if(event.key==='Enter')askAI()"><button class="btn" onclick="askAI()">검색</button></div>
  <div class="sugg">${['어제 매출 상위 5개 매장','인천 매출 하락 매장','배달 비중 높은 매장','QSC 80점 미만 매장','치즈폭탄통닭 많이 판 매장','주류 비중 낮은 매장','서울 평균 객단가','본사 미등록 옵션 파는 매장'].map(q=>`<button onclick="document.getElementById('aiq').value='${q}';askAI()">${q}</button>`).join('')}</div>
  <div class="chat" id="chat">${chatLog.join('')}</div></div>`}
window.askAI=()=>{const q=$('#aiq').value.trim();if(!q)return;
  const rg=regions().find(r=>q.includes(r));let pool=rg?stores.filter(s=>s.region===rg):stores;
  const nM=(q.match(/(\d+)\s*(개|곳|위)?/)||[])[1];const n=+nM||5;
  const menu=MENUS.find(m=>q.replace(/\s/g,'').includes(m.n.replace(/\s/g,'')));
  let title='',rows=[],cols=[];
  const tbl=(list,fs)=>`<table style="margin-top:8px"><tr>${fs.map(f=>`<th>${f[0]}</th>`).join('')}</tr>${list.map(s=>`<tr class="click" onclick="openStore(${s.id})">${fs.map(f=>`<td>${f[1](s)}</td>`).join('')}</tr>`).join('')}</table>`;
  let ans='';
  if(REAL&&(menu||/미등록|옵션|주류|술|qsc|QSC|점검/.test(q)))ans='지금 불러온 실제 데이터(배달매출 파일)에는 메뉴·주류·옵션·QSC 정보가 없어요. 매출·하락·배달·객단가·지역으로 물어봐 주세요.';
  else if(menu){const l=[...pool].sort((a,b)=>b.menu.find(x=>x.n===menu.n).qty-a.menu.find(x=>x.n===menu.n).qty).slice(0,n);
    ans=`최근 7일 <b>${menu.n}</b> 판매량 상위 ${l.length}개 매장${rg?` (${rg})`:''}입니다. 전체 ${won(sum(stores,s=>s.menu.find(x=>x.n===menu.n).qty))}개 판매.`+tbl(l,[['매장',s=>s.name],['판매량',s=>s.menu.find(x=>x.n===menu.n).qty+'개'],['지역',s=>s.region]]);}
  else if(/미등록|옵션/.test(q)){const l=pool.filter(s=>s.unreg);ans=`본사 미등록 옵션을 판매 중인 매장 ${l.length}곳입니다.`+tbl(l,[['매장',s=>s.name],['옵션',s=>s.unreg]]);}
  else if(/qsc|QSC|점검/.test(q)){const th=+(q.match(/(\d+)\s*점/)||[])[1]||80;const l=pool.filter(s=>s.qsc!=null&&s.qsc<th).sort((a,b)=>a.qsc-b.qsc);ans=`QSC ${th}점 미만 매장 ${l.length}곳${rg?` (${rg})`:''}입니다.`+tbl(l.slice(0,12),[['매장',s=>s.name],['QSC',s=>s.qsc],['마지막 점검',s=>s.lastInsp+'일 전']]);}
  else if(/배달/.test(q)){const l=[...pool].sort((a,b)=>(b.deliv||0)-(a.deliv||0)).slice(0,n);ans=`배달 비중 상위 ${l.length}개 매장입니다.`+tbl(l,[['매장',s=>s.name],['배달비중',s=>(s.deliv*100).toFixed(1)+'%'],['7일 일평균',s=>man(s.avg7)]]);}
  else if(/주류|술/.test(q)){const low=/낮/.test(q);const l=[...pool].sort((a,b)=>(low?1:-1)*(a.alcohol-b.alcohol)).slice(0,n);ans=`주류 비중 ${low?'하위':'상위'} ${l.length}개 매장입니다.`+tbl(l,[['매장',s=>s.name],['주류비중',s=>(s.alcohol*100).toFixed(1)+'%']]);}
  else if(/객단가/.test(q)){const a=sum(pool,s=>s.y)/sum(pool,s=>s.orders);ans=`${rg||'전체'} 전일 평균 객단가는 <b>${won(a)}원</b>입니다.`+tbl([...pool].sort((x,y)=>y.aov-x.aov).slice(0,n),[['매장',s=>s.name],['객단가',s=>won(s.aov)+'원']]);}
  else if(/하락|감소|떨어|급감/.test(q)){const l=[...pool].sort((a,b)=>a.wow-b.wow).slice(0,n);ans=`${rg||'전체'} 전주 대비 매출 하락 폭이 큰 매장입니다.`+tbl(l,[['매장',s=>s.name],['전주比',s=>`<span class="down">${pct(s.wow)}</span>`],['동요일比',s=>pct(s.vsWd)]]);}
  else if(/매출|top|TOP|상위|순위/.test(q)){const l=[...pool].sort((a,b)=>b.y-a.y).slice(0,n);ans=`${rg||'전체'} ${REAL?fmtD(BASE):'어제'} 매출 상위 ${l.length}개 매장입니다. 합계 ${man(sum(l,s=>s.y))}원.`+tbl(l,[['매장',s=>s.name],['전일매출',s=>won(s.y)+'원'],['동요일比',s=>pct(s.vsWd)]]);}
  else{const st=stores.find(s=>q.includes(s.name.replace('점',''))); if(st){openStore(st.id);ans=`${st.name} 상세를 열었어요.`}else ans='아직 이해하지 못한 질문이에요. 매출·하락·배달·주류·객단가·QSC·메뉴명·지역명을 넣어 물어봐 주세요.';}
  chatLog.unshift(`<div class="bub me">${q}</div>`,`<div class="bub ai">${ans}</div>`);chatLog=chatLog.slice(0,12);$('#chat').innerHTML=chatLog.join('');$('#aiq').value=''}

/* ============ 실제 데이터 (배달매출 + POS 홀매출) ============ */
const REGION_SHORT={'서울특별시':'서울','인천광역시':'인천','경기도':'경기','강원도':'강원','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','세종특별자치시':'세종','대전광역시':'대전','부산광역시':'부산','대구광역시':'대구','광주광역시':'광주','울산광역시':'울산','경상남도':'경남','경상북도':'경북','전라남도':'전남','전라북도':'전북','전북특별자치도':'전북','제주특별자치도':'제주'};
const kk=s=>String(s??'').replace(/\s+/g,'');
const numv=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=Number(String(v).replace(/["',\s원]/g,''));return isFinite(n)?n:0};
const dnum=v=>{let d=null;if(Object.prototype.toString.call(v)==='[object Date]')d=new Date(v.getFullYear(),v.getMonth(),v.getDate());else{const m=String(v??'').match(/(\d{4})[.\-\/년]\s*(\d{1,2})[.\-\/월]\s*(\d{1,2})/);if(m)d=new Date(+m[1],+m[2]-1,+m[3]);}return d?Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5):null};

window.refreshArch=()=>loadArchive().then(()=>{if(cur==='home')render()});
const dkey=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const dn0=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
function dayMaps(){
  const out={h:new Map(),d:new Map()};const put=(f,dn,v,src)=>{if(!out[f].has(dn))out[f].set(dn,{v,src})};
  if(REAL){const D0=stores[0].days;D0.forEach((dd,i)=>{const dn=dn0(dd.d);put('h',dn,sum(stores,s=>s.days[i].dine+s.days[i].take),'실제 데이터 ('+REAL.src+')');put('d',dn,sum(stores,s=>s.days[i].dl),'실제 데이터 ('+REAL.src+')')})}
  for(const f of ['h','d']){
    const ds=[...ARCH].sort((p,q)=>(p.b-p.a)-(q.b-q.a));
    for(const x of ds){const per=new Map();let any=false;
      for(const r of (x.rows||[])){const v=f==='h'?(r.hm??r.hn):(r.da??r.db);if(v==null)continue;any=true;const span=r.b-r.a+1;for(let dn=r.a;dn<=r.b;dn++)per.set(dn,(per.get(dn)||0)+v/span)}
      if(!any)continue;for(const [dn,v] of per)put(f,dn,v,'매출 보관함: '+x.name)}}
  for(const s of MSEED){const a=dkey(s.a),b=dkey(s.b),span=b-a+1;for(let dn=a;dn<=b;dn++){put('h',dn,s.h/span,s.src);put('d',dn,s.d/span,s.src)}}
  return out;
}
const lyDay=dn=>{const d=dfrom(dn);const r=new Date(d.getFullYear()-1,d.getMonth(),d.getDate());if(r.getMonth()!==d.getMonth())r.setDate(0);return dn0(r)};
function monthData(){
  const m=dayMaps(),months=new Map();
  for(const f of ['h','d'])for(const [dn,o] of m[f]){const dt=dfrom(dn),k=dt.getFullYear()*12+dt.getMonth();
    if(!months.has(k))months.set(k,{h:0,d:0,days:new Set(),src:new Set()});const M=months.get(k);M[f]+=o.v;M.days.add(dn);M.src.add(o.src)}
  const keys=[...months.keys()].sort((a,b)=>a-b),show=keys.filter(k=>!months.has(k+12)).slice(-12);
  return show.map(k=>{const M=months.get(k),arr=[...M.days].sort((a,b)=>a-b);let lh=0,ld=0,lc=0;const ls=new Set();
    for(const dn of arr){const l=lyDay(dn),H=m.h.get(l),D=m.d.get(l);if(H){lh+=H.v;ls.add(H.src)}if(D){ld+=D.v;ls.add(D.src)}if(H||D)lc++}
    const y=Math.floor(k/12),mo=k%12+1,dim=new Date(y,mo,0).getDate(),f=dfrom(arr[0]).getDate(),t=dfrom(arr[arr.length-1]).getDate();
    return {label:`${String(y).slice(2)}년 ${mo}월`,full:`${y}년 ${mo}월`,range:arr.length<dim?`${f}~${t}일`:'',days:arr.length,
      cur:{h:M.h,d:M.d,t:M.h+M.d},ly:lc?{h:lh,d:ld,t:lh+ld,cov:lc}:null,src:[...M.src],lsrc:[...ls]}});
}
window._mb={};let MBID=0;
function monthlyChart(){
  const G=monthData();if(!G.length)return '<p class="hint">월매출 데이터가 없어요.</p>';
  const W=640,H=250,p=34,top=26,mx=Math.max(...G.map(g=>Math.max(g.cur.t,g.ly?g.ly.t:0)))*1.12||1;
  const gw=(W-2*p)/G.length,bw=Math.min(56,gw*0.3),y=v=>H-p-v/mx*(H-p-top);
  const id='mb'+(MBID++);window._mb[id]=G;
  let g='';for(let k=0;k<=4;k++){const yy=top+k*(H-p-top)/4;g+=`<line x1="${p}" x2="${W-p}" y1="${yy}" y2="${yy}" stroke="#f0e9df"/>`}
  const bars=G.map((G1,i)=>{const cx=p+gw*(i+0.5),xl=cx-bw-4,xc=cx+4;let s='';
    if(G1.ly){s+=`<rect x="${xl}" y="${y(G1.ly.h)}" width="${bw}" height="${H-p-y(G1.ly.h)}" fill="#B9B0A6" rx="3"/><rect x="${xl}" y="${y(G1.ly.t)}" width="${bw}" height="${y(G1.ly.h)-y(G1.ly.t)}" fill="#DDD5CB" rx="3"/>
      <text x="${xl+bw/2}" y="${y(G1.ly.t)-6}" font-size="11" text-anchor="middle" fill="#8A837C">${man(G1.ly.t)}</text>`}
    else s+=`<rect x="${xl}" y="${H-p-40}" width="${bw}" height="40" fill="none" stroke="#D8CFC4" stroke-dasharray="4 3" rx="3"/><text x="${xl+bw/2}" y="${H-p-46}" font-size="10" text-anchor="middle" fill="#B0A79D">전년 없음</text>`;
    s+=`<rect x="${xc}" y="${y(G1.cur.h)}" width="${bw}" height="${H-p-y(G1.cur.h)}" fill="#C8102E" rx="3"/><rect x="${xc}" y="${y(G1.cur.t)}" width="${bw}" height="${y(G1.cur.h)-y(G1.cur.t)}" fill="#F08A9A" rx="3"/>
      <text x="${xc+bw/2}" y="${y(G1.cur.t)-6}" font-size="11" font-weight="700" text-anchor="middle" fill="#1E1A17">${man(G1.cur.t)}</text>`;
    if(G1.ly){const r=G1.cur.t/G1.ly.t-1;s+=`<text x="${cx}" y="${top-8}" font-size="12" font-weight="800" text-anchor="middle" fill="${r>=0?'#2E8B57':'#C8102E'}">${pct(r)}</text>`}
    s+=`<text x="${cx}" y="${H-14}" font-size="12" font-weight="700" text-anchor="middle" fill="#4A443F">${G1.label}</text>`+(G1.range?`<text x="${cx}" y="${H-1}" font-size="10" text-anchor="middle" fill="#8A837C">(${G1.range})</text>`:'');
    s+=`<rect x="${p+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent" style="cursor:pointer" onmouseenter="mbTip('${id}',${i},this)" onclick="mbTip('${id}',${i},this)"/>`;return s}).join('');
  const last=G[G.length-1],cmp=(a,b)=>b?`<span class="${a>=b?'up':'down'}">${pct(a/b-1)}</span>`:'<span class="hint">-</span>';
  const tbl=`<table style="margin-top:6px"><thead><tr><th>${last.full}${last.range?` (${last.range})`:''}</th><th class="num">올해</th><th class="num">전년 동기</th><th class="num">등락</th></tr></thead><tbody>
    ${[['홀','h'],['배달','d'],['홀+배달 (총매출)','t']].map(([l,k])=>`<tr><td><b>${l}</b></td><td class="num">${won(last.cur[k])}</td><td class="num">${last.ly?won(last.ly[k]):'-'}</td><td class="num">${cmp(last.cur[k],last.ly&&last.ly[k])}</td></tr>`).join('')}</tbody></table>`;
  const legend=`<div class="row hint" style="gap:14px;margin:4px 0 2px"><span><i style="display:inline-block;width:10px;height:10px;background:#C8102E;border-radius:2px"></i> 올해 홀</span><span><i style="display:inline-block;width:10px;height:10px;background:#F08A9A;border-radius:2px"></i> 올해 배달</span><span><i style="display:inline-block;width:10px;height:10px;background:#B9B0A6;border-radius:2px"></i> 전년 홀</span><span><i style="display:inline-block;width:10px;height:10px;background:#DDD5CB;border-radius:2px"></i> 전년 배달</span></div>`;
  const srcs=[...new Set(G.flatMap(x=>x.lsrc))];
  return `${legend}<div class="lc-wrap" id="${id}" onmouseleave="this.querySelector('.lc-tip').classList.remove('on')"><svg viewBox="0 0 ${W} ${H}" width="100%">${g}${bars}</svg><div class="lc-tip"></div></div>${tbl}
   <p class="hint" style="margin-top:8px">같은 날짜끼리 비교해요(예: 11월 1~15일 vs 전년 11월 1~15일). 전년 출처: ${srcs.length?srcs.join(', '):'없음'}.
   ${G.some(x=>!x.ly)?` 전년 데이터가 없는 달은 <a href="#" onclick="goLY();return false" style="color:var(--red);font-weight:700">작년 매출 등록</a>으로 채울 수 있어요.`:''}</p>`;
}
window.mbTip=(id,i,el)=>{const G=window._mb[id][i],w=document.getElementById(id),tip=w.querySelector('.lc-tip');
  tip.innerHTML=`<div class="lc-d">${G.full}${G.range?` (${G.range})`:''}</div><div>올해 <b>${won(G.cur.t)}원</b></div><div class="lc-s">홀 ${won(G.cur.h)} · 배달 ${won(G.cur.d)}</div>`+
    (G.ly?`<div class="lc-s">전년 동기 ${won(G.ly.t)}원 <span class="${G.cur.t>=G.ly.t?'up':'down'}">${pct(G.cur.t/G.ly.t-1)}</span></div>`:'<div class="lc-s">전년 동기 데이터 없음</div>');
  const n=window._mb[id].length,lx=(34+(640-68)/n*(i+0.5))/640*100;tip.style.left=lx+'%';tip.style.top='22%';
  tip.style.transform=`translate(${lx<20?'-10%':lx>80?'-90%':'-50%'},0)`;tip.classList.add('on')};
window.goLY=()=>{go('report');const f=$('#srFrame');let n=0;const t=()=>{try{f.contentWindow.openPrep()}catch(e){if(n++<20)setTimeout(t,400)}};setTimeout(t,900)};
function dailyChart(){const D0=stores[0].days,L=D0.length,st=Math.max(0,L-14),idx=D0.slice(st).map((_,i)=>st+i),ser=[{data:idx.map(i=>sum(stores,s=>s.days[i].v))}];if(st-7>=0)ser.push({data:idx.map(i=>sum(stores,s=>s.days[i-7].v))});return line(ser,idx.map(i=>fmtD(D0[i].d).replace(/\(.\)/,'')),{tips:idx.map(i=>fmtD(D0[i].d))})}
function trendCard(){
  const seg=`<div class="tg"><button class="${trendMode==='day'?'on':''}" onclick="trendMode='day';render()">일매출</button><button class="${trendMode==='month'?'on':''}" onclick="trendMode='month';render();refreshArch()">월매출</button></div>`;
  if(trendMode==='day')return `<div class="card" style="margin-top:16px"><h3><span>전 가맹점 일매출 추이 <small>최근 14일 · 점선은 전주 동기${REAL&&REAL.est.추정?' · 일부 홀 추정 포함':''}</small></span>${seg}</h3>${dailyChart()}${realNote()}</div>`;
  return `<div class="card" style="margin-top:16px"><h3><span>전 가맹점 월매출 <small>올해 vs 전년 동기 · 막대 위 %는 총매출 등락</small></span>${seg}</h3>${monthlyChart()}</div>`;
}

function decodeSR(){const b=atob(SR_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
function render(){if(cur==='report')return;const y=window.scrollY;$('#main').innerHTML=VIEWS[cur]();window.scrollTo(0,y)}
function go(v){cur=v;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const sr=v==='report';$('#main').hidden=sr;$('#srWrap').hidden=!sr;$('#mainWrap').classList.toggle('sr',sr);
  if(sr){const f=$('#srFrame');if(!f.srcdoc)f.srcdoc=decodeSR();}
  window.scrollTo(0,0);render()}
window.go=go;
window.render=render;
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));
render();
</script>
